[project]
name = "ecommerce-security"
version = "0.1.0"
description = "Security helpers for password hashing, JWTs, permissions, and WSO2 flows."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=48.0.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "python-jose>=3.5.0",
    "ecommerce-observability>=0.1.0",
    "ecommerce-config>=0.1.0",
    "ecommerce-errors>=0.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
