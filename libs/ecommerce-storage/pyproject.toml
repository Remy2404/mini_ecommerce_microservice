[project]
name = "ecommerce-storage"
version = "0.1.0"
description = "Object storage and image processing helpers."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.18",
    "pillow>=12.2.0",
    "ecommerce-config>=0.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

