[project]
name = "ecommerce-observability"
version = "0.1.0"
description = "Logging, metrics, tracing, and HTTP instrumentation helpers for the mini-ecommerce services."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "opentelemetry-api>=1.42.0",
    "opentelemetry-exporter-otlp>=1.42.0",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
    "opentelemetry-sdk>=1.42.0",
    "prometheus-client>=0.25.0",
    "structlog>=25.5.0",
    "ecommerce-config>=0.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
