[project]
name = "ecommerce-messaging"
version = "0.1.0"
description = "RabbitMQ broker, consumer, publisher, retry, and serialization helpers."
requires-python = ">=3.12"
dependencies = [
    "faststream[rabbit]>=0.6.7",
    "pydantic>=2.13.4",
    "ecommerce-contracts>=0.1.0",
    "ecommerce-observability>=0.1.0",
    "ecommerce-config>=0.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
